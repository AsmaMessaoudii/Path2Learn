# config/services.yaml

parameters:
    # Clés API
    openai_api_key: '%env(GEMINI_API_KEY)%'
    groq_api_key: '%env(GROQ_API_KEY)%'
    groq_api_url: '%env(GROQ_API_URL)%'
    mercure.default_hub: 'http://localhost:3000/.well-known/mercure'

    # Valeurs par défaut pour les variables d'environnement
    env(GROQ_API_KEY): ''
    env(GROQ_API_URL): 'https://api.groq.com/openai/v1/chat/completions'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # --- Services existants ---

    App\Service\OpenAIService:
        arguments:
           $apiKey: '%env(GROQ_API_KEY)%'           # ← on passe la clé Groq
           $model: '%env(GROQ_MODEL)%'

    App\Service\ContentExtractorService:
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads/ressources'

    App\Service\AISummaryService:
        arguments:
            $uploadDirectory: '%kernel.project_dir%/public/uploads/ressources'

    App\Service\ChatbotService:
        arguments:
            $geminiApiKey: '%env(GEMINI_API_KEY)%'
            $uploadDirectory: '%kernel.project_dir%/public/uploads/ressources'

    # --- Service IA Groq ---

    App\Service\AIService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $apiKey: '%groq_api_key%'
            $apiUrl: '%groq_api_url%'
        tags:
            - { name: 'monolog.logger', channel: 'ai' }

    # Client HTTP
    Symfony\Contracts\HttpClient\HttpClientInterface:
        alias: 'http_client'

    # Logger dédié à l'IA
    monolog.logger.ai:
        class: Symfony\Bridge\Monolog\Logger
        arguments: ['ai']
        calls:
            - [pushHandler, ['@monolog.handler.ai']]

    monolog.handler.ai:
        class: Monolog\Handler\StreamHandler
        arguments:
            - '%kernel.logs_dir%/ai_%kernel.environment%.log'
            - !php/const Monolog\Logger::DEBUG